<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TS9 Visual Validator — headless render target</title>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import * as THREE from 'three';
import { assemblePedal, FIN } from './parts.js';

const spec = await (await fetch('./specs/ts9.json')).json();
const { w, d, h } = spec.dims;

// --- Renderer (no antialias for crisp mask edges in ID mode) ---
const urlParams = new URLSearchParams(window.location.search);
const mode = urlParams.get('mode') || 'beauty'; // 'beauty' or 'id'
const view = urlParams.get('view') || 'top';    // 'top', 'side', 'threequarter'

const renderer = new THREE.WebGLRenderer({ antialias: mode === 'beauty', preserveDrawingBuffer: true });
// Use aspect-correct canvas size to avoid distorting the orthographic camera.
// The camera frustum is camW x camH; the canvas must match that aspect.
const BASE = 1200;
const pad = 0.3; // inches of padding around pedal
let canvasW = BASE, canvasH = BASE;
// (camW/camH computed after camera setup below; we set size then. For now,
// compute from view type and dims.)
if (view === 'top') {
  const aspect = (w + pad * 2) / (d + pad * 2);
  if (aspect < 1) { canvasW = Math.round(BASE * aspect); canvasH = BASE; }
  else { canvasW = BASE; canvasH = Math.round(BASE / aspect); }
} else if (view === 'side') {
  const aspect = (d + pad * 2) / (h + pad * 2);
  if (aspect < 1) { canvasW = Math.round(BASE * aspect); canvasH = BASE; }
  else { canvasW = BASE; canvasH = Math.round(BASE / aspect); }
}
renderer.setSize(canvasW, canvasH);
renderer.setClearColor(0x000000, 1);
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();

// --- Lighting ---
if (mode === 'beauty') {
  // Studio-like lighting for visual comparison
  const key = new THREE.DirectionalLight(0xffffff, 2.0);
  key.position.set(5, 8, 6);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.6);
  fill.position.set(-6, 3, -4);
  scene.add(fill);
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
} else {
  // Flat lighting for ID mode — pure color, no shading variation
  scene.add(new THREE.AmbientLight(0xffffff, 3.0));
}

// --- Build pedal ---
const A = assemblePedal(spec);
scene.add(A.group);

// --- ID mode: replace all materials with flat ID colors ---
// Green (enclosure) = #00FF00, Black (plastic) = #000000... wait, black on black bg won't work.
// Use: Green = pure green, Black parts = pure red, Silver/metal = pure blue, Other = magenta
if (mode === 'id') {
  const idMats = {
    green: new THREE.MeshBasicMaterial({ color: 0x00ff00 }),
    black: new THREE.MeshBasicMaterial({ color: 0xff0000 }),
    silver: new THREE.MeshBasicMaterial({ color: 0x0000ff }),
    white: new THREE.MeshBasicMaterial({ color: 0x00ffff }), // cyan for white plate
    other: new THREE.MeshBasicMaterial({ color: 0xff00ff }),
  };
  // Background: white (distinct from all ID colors except white plate which is cyan)
  renderer.setClearColor(0xffffff, 1);

  A.group.traverse((obj) => {
    if (obj.isMesh) {
      const mat = obj.material;
      const color = mat.color ? mat.color.getHex() : 0;
      // Classify by material color/properties
      let idMat;
      // White plate: the ibanezPlate uses plateRib (silver-ish) but it's actually white plastic
      // We detect it by checking if it's part of the ibanez plate group
      // For now: plateRib with stripe texture = footswitch (silver), plain white = plate
      if (color === 0x7fb75c || (mat.isMeshPhysicalMaterial && mat.clearcoat > 0)) {
        idMat = idMats.green; // enclosure (powder coat)
      } else if (mat.metalness > 0.5) {
        // Distinguish: footswitch (has bump texture) vs plate (plain)
        // Actually, the Ibanez plate is white plastic, not metal. Check the mesh name/context.
        // For now, treat all metal as silver; the plate is a separate mesh we'll tag.
        idMat = idMats.silver; // chrome/metal
      } else if (color < 0x303030 || mat.map) {
        idMat = idMats.black; // black plastic OR textured artwork (tick rings, labels)
      } else if (color > 0xf0f0f0) {
        idMat = idMats.white; // white plate
      } else {
        idMat = idMats.other;
      }
      // Preserve texture as alpha for canvas-texture artwork (tick rings, labels)
      // The canvas has opaque artwork on transparent bg. We need a proper
      // alpha mask: create a white-on-black version for use as alphaMap.
      if (mat.map && mat.transparent) {
        const srcCanvas = mat.map.image;
        const alphaCanvas = document.createElement('canvas');
        alphaCanvas.width = srcCanvas.width;
        alphaCanvas.height = srcCanvas.height;
        const actx = alphaCanvas.getContext('2d');
        // Draw the original, then use its alpha to mask white
        actx.drawImage(srcCanvas, 0, 0);
        actx.globalCompositeOperation = 'source-in';
        actx.fillStyle = '#ffffff';
        actx.fillRect(0, 0, alphaCanvas.width, alphaCanvas.height);
        const alphaTex = new THREE.CanvasTexture(alphaCanvas);
        obj.material = new THREE.MeshBasicMaterial({
          color: idMat.color,
          alphaMap: alphaTex,
          transparent: true,
        });
      } else {
        obj.material = idMat;
      }
    }
  });

  // Tag the Ibanez plate specifically: find it by its position/size
  // The plate is at spec.ibanezPlate position. We'll color it cyan.
  // (This is a hack; better to tag during assembly, but works for validation.)
  A.group.traverse((obj) => {
    if (obj.isMesh && obj.material === idMats.silver) {
      // Check if this is the plate by its geometry size
      // Plate is ~2.14 x 0.73, footswitch is ~2.09 x 1.38
      const size = new THREE.Vector3();
      new THREE.Box3().setFromObject(obj).getSize(size);
      // Plate is wider than tall, footswitch is also wider than tall...
      // Better: check y position. Plate is on the deck (y ~1.5), footswitch is lower (y ~1.0)
      const pos = new THREE.Vector3();
      obj.getWorldPosition(pos);
      if (pos.y > 1.3 && size.x > 1.5 && size.z < 1.0) {
        obj.material = idMats.white; // cyan
      }
    }
  });
}

// --- Camera: orthographic for true measurement ---
let camW, camH, camPos, camUp;

if (view === 'top') {
  // Looking down -Y, X = width, Z = depth
  camW = w + pad * 2;
  camH = d + pad * 2;
  camPos = [0, 10, 0];
  camUp = [0, 0, -1]; // -Z is up in the image (back of pedal at top)
} else if (view === 'side') {
  // Looking from +X (right side), Z = depth (horizontal), Y = height (vertical)
  camW = d + pad * 2;
  camH = h + pad * 2;
  camPos = [10, h / 2, 0];
  camUp = [0, 1, 0];
} else {
  // Three-quarter beauty shot (perspective)
  camPos = [6.4, 4.8, 8.8];
}

let camera;
if (view === 'threequarter') {
  camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
  camera.position.set(...camPos);
  camera.lookAt(0, h / 2, 0);
} else {
  camera = new THREE.OrthographicCamera(-camW/2, camW/2, camH/2, -camH/2, 0.1, 50);
  camera.position.set(...camPos);
  camera.up.set(...camUp);
  // For top view: look at center. For side view: look at center height.
  const lookY = view === 'top' ? 0 : h / 2;
  camera.lookAt(0, lookY, 0);
}

// --- Render and expose capture ---
renderer.render(scene, camera);

// Signal ready and expose capture function
window.__renderDone = true;
window.__capture = () => {
  return renderer.domElement.toDataURL('image/png');
};
window.__viewInfo = { view, mode, camW, camH, canvasW, canvasH, dims: { w, d, h }, pad };
</script>
</body>
</html>
